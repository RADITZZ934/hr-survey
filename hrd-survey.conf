# Config dikodekan secara otomatis via nginx.js

# Rate Limiting & Connection Limiting Zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    listen [::]:80;
    server_name hr-survey.u-u.id;

    # Logging
    access_log /var/log/nginx/hrd_survey_access.log;
    error_log /var/log/nginx/hrd_survey_error.log;

    # Dynamic Proxy Headers
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Backend API Routing (/api/ atau /api)
    location /api {
        # Apply Rate Limiting & Connection Limiting
        limit_req zone=api_limit burst=30 nodelay;
        limit_conn conn_limit 15;

        proxy_pass http://127.0.0.1:10001;
    }

    # Frontend App Routing (Default /)
    location / {
        proxy_pass http://127.0.0.1:10000/;
    }
}
